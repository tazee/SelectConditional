        <atom type="Desc">Method to compute edge normal.</atom>
        <atom type="ArgumentType">open_edges</atom>
      </hash>
      <hash type="Attribute" key="deselect">
        <atom type="UserName">Deselect</atom>
        <atom type="Desc">Deselect the edges.</atom>
      </hash>
      <hash type="Attribute" key="tolerance">
        <atom type="UserName">Angle Tolerance</atom>
        <atom type="Desc">Angle tolerance.</atom>
