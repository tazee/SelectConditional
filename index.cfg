    <hash type="Tool" key="select.edgesByNormal@en_US">
      <atom type="UserName">Select Edges By Normal</atom>
      <atom type="Tooltip">Select Edges By Normal</atom>
      <atom type="Desc">Select edges by edge normal tool.</atom>
