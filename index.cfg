<?xml version="1.0" encoding="UTF-8"?>
<configuration kit="SelectConditional" version="1.0">
  <atom type="Extensions64">
    <list type="AutoScan">extra</list>
  </atom>
  <atom type="Attributes">
    <hash type="Sheet" key="SelectConditional_Help:sheet">
      <atom type="Label">Conditional Selection</atom>
      <atom type="Group">Conditional Selection</atom>
      <atom type="Style">inline</atom>
      <hash type="InCategory" key="ExtensionHelp:sheet#tail">
        <atom type="Ordinal">30</atom>
      </hash>
      <list type="Control" val="cmd file.open {kit_SelectConditional:README.html}">
        <atom type="Label">Conditional Selection Help</atom>
        <atom type="StartCollapsed">0</atom>
        <atom type="Hash">SelectConditional_Help:control</atom>
      </list>
    </hash>
    <hash type="Sheet" key="SelectConditionalToolbar:sheet">
      <atom type="Label">Conditional Selection</atom>
      <atom type="Style">popover</atom>
      <hash type="InCategory" key="TemplateModelToolbar:Select#tail">
        <atom type="Ordinal">49.50.65</atom>
      </hash>
      <list type="Control" val="cmd tool.set select.edgesByLength on">
        <atom type="Label">Select Edges By Length</atom>
      </list>
      <list type="Control" val="cmd tool.set select.edgesByNormal on">
        <atom type="Label">Select Edges By Normal</atom>
      </list>
      <list type="Control" val="cmd tool.set select.edgesByAngle on">
        <atom type="Label">Select Edges By Angle</atom>
      </list>
    </hash>
  </atom>

  <!-- Select Edges By Length -->
  <atom type="Attributes">
    <hash type="Sheet" key="SelectEdgesByLength:sheet">
      <atom type="Label">Select Edges By Length</atom>
      <atom type="ShowLabel">1</atom>
      <atom type="Layout">properties</atom>
      <atom type="Columns">1</atom>
      <atom type="IconMode">text</atom>
      <atom type="IconSize">small</atom>
      <atom type="FilterCommand">tool.isActive select.edgesByLength</atom>
      <hash type="InCategory" key="toolprops:general#head">
        <atom type="Ordinal">100.70</atom>
      </hash>
      <list type="Control" val="cmd tool.attr select.edgesByLength length ?">
		    <atom type="ShowWhenDisabled">0</atom>
      </list>
      <list type="Control" val="cmd tool.attr select.edgesByLength operator ?">
		    <atom type="ShowWhenDisabled">1</atom>
      </list>
      <list type="Control" val="cmd tool.attr select.edgesByLength deselect ?">
		    <atom type="ShowWhenDisabled">1</atom>
      </list>
    </hash>
    <hash type="Sheet" key="select.edgesByLength.item:sheet">
      <atom type="Label">Select Edges By Length</atom>
      <atom type="Filter">select.edgesByLength.item:filterPreset</atom>
      <atom type="FilterCommand">item.withTypeIsSelected {select.edgesByLength.item} testSupertypes:true</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">110</atom>
      </hash>
    </hash>
  </atom>
  <atom type="CommandHelp">
    <hash type="Tool" key="select.edgesByLength@en_US">
      <atom type="UserName">Select Edges By Length</atom>
      <atom type="Tooltip">Select Edges By Length</atom>
      <atom type="Desc">Select edges by length tool.</atom>
      <hash type="Attribute" key="length">
        <atom type="UserName">Length</atom>
        <atom type="Desc">Edge length.</atom>
      </hash>
      <hash type="Attribute" key="operator">
        <atom type="UserName">Operator</atom>
        <atom type="Desc">Comparison operator for angle.</atom>
        <atom type="ArgumentType">comparison_operators</atom>
      </hash>
      <hash type="Attribute" key="deselect">
        <atom type="UserName">Deselect</atom>
        <atom type="Desc">Deselect the edges.</atom>
      </hash>
    </hash>
    <hash type="ArgumentType" key="comparison_operators@en_US">
      <hash type="Option" key="less_than">
        <atom type="UserName">&lt;</atom>
        <atom type="Desc">Less than.</atom>
      </hash>
      <hash type="Option" key="equal">
        <atom type="UserName">=</atom>
        <atom type="Desc">Equal.</atom>
      </hash>
      <hash type="Option" key="greater_than">
        <atom type="UserName">&gt;</atom>
        <atom type="Desc">Greater than.</atom>
      </hash>
    </hash>
  </atom>
  <atom type="Messages">
    <hash type="Table" key="select.edgesByLength.en_US">
      <hash type="T" key="NoVertex">This tool is no mesh element on active meshes.</hash>
    </hash>
  </atom>

  <!-- Select Edges By Normal -->
  <atom type="Attributes">
    <hash type="Sheet" key="SelectEdgesByNormal:sheet">
      <atom type="Label">Select Edges By Normal</atom>
      <atom type="ShowLabel">1</atom>
      <atom type="Layout">properties</atom>
      <atom type="Columns">1</atom>
      <atom type="IconMode">text</atom>
      <atom type="IconSize">small</atom>
      <atom type="FilterCommand">tool.isActive select.edgesByNormal</atom>
      <hash type="InCategory" key="toolprops:general#head">
        <atom type="Ordinal">100.70</atom>
      </hash>
      <list type="Control" val="cmd tool.attr select.edgesByNormal openEdge ?">
		    <atom type="ShowWhenDisabled">1</atom>
      </list>
      <list type="Control" val="cmd tool.attr select.edgesByNormal deselect ?">
		    <atom type="ShowWhenDisabled">1</atom>
      </list>
    </hash>
    <hash type="Sheet" key="edge_vector:sheet">
		<atom type="Label">Edge Vector</atom>
		<atom type="Style">inlinegang</atom>
		<list type="Control" val="cmd tool.attr tool.edgesByNormal vectorX ?">
			<atom type="ShowWhenDisabled">0</atom>
		</list>
		<list type="Control" val="cmd tool.attr tool.edgesByNormal vectorY ?">
			<atom type="Label">Y</atom>
			<atom type="ShowWhenDisabled">0</atom>
		</list>
		<list type="Control" val="cmd tool.attr tool.edgesByNormal vectorZ ?">
			<atom type="Label">Z</atom>
			<atom type="ShowWhenDisabled">0</atom>
		</list>
    </hash>
    <hash type="Sheet" key="select.edgesByNormal.item:sheet">
      <atom type="Label">Select Edges By Normal</atom>
      <atom type="Filter">select.edgesByNormal.item:filterPreset</atom>
      <atom type="FilterCommand">item.withTypeIsSelected {select.edgesByNormal.item} testSupertypes:true</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">110</atom>
      </hash>
    </hash>
  </atom>
  <atom type="CommandHelp">
    <hash type="Tool" key="select.edgesByNormal@en_US">
      <atom type="UserName">Select Edges By Normal</atom>
      <atom type="Tooltip">Select Edges By Normal</atom>
      <atom type="Desc">Select edges by edge normal tool.</atom>
      <hash type="Attribute" key="vectorX">
        <atom type="UserName">Vector X</atom>
        <atom type="Desc">Normal vector X.</atom>
      </hash>
      <hash type="Attribute" key="vectorY">
        <atom type="UserName">Vector Y</atom>
        <atom type="Desc">Normal vector Y.</atom>
      </hash>
      <hash type="Attribute" key="vectorZ">
        <atom type="UserName">Vector Z</atom>
        <atom type="Desc">Normal vector Z.</atom>
      </hash>
      <hash type="Attribute" key="openEdge">
        <atom type="UserName">Open Edge</atom>
        <atom type="Desc">Method to compute edge normal.</atom>
        <atom type="ArgumentType">open_edges</atom>
      </hash>
      <hash type="Attribute" key="deselect">
        <atom type="UserName">Deselect</atom>
        <atom type="Desc">Deselect the edges.</atom>
      </hash>
    </hash>
    <hash type="ArgumentType" key="open_edges@en_US">
      <hash type="Option" key="polyNormal">
        <atom type="UserName">Polygon Normal</atom>
        <atom type="Desc">Polygon normal.</atom>
      </hash>
      <hash type="Option" key="outVector">
        <atom type="UserName">Out Vector</atom>
        <atom type="Desc">Outgoing vector.</atom>
      </hash>
    </hash>
  </atom>
  <atom type="Messages">
    <hash type="Table" key="select.edgesByNormal.en_US">
      <hash type="T" key="NoEdgeSelected">Please select the edge to serve as the reference edge.</hash>
      <hash type="T" key="NoVertex">This tool is no mesh element on active meshes.</hash>
    </hash>
  </atom>

  <!-- Select Edges By Angle -->
  <atom type="Attributes">
    <hash type="Sheet" key="SelectEdgesByAngle:sheet">
      <atom type="Label">Select Edges By Angle</atom>
      <atom type="ShowLabel">1</atom>
      <atom type="Layout">properties</atom>
      <atom type="Columns">1</atom>
      <atom type="IconMode">text</atom>
      <atom type="IconSize">small</atom>
      <atom type="FilterCommand">tool.isActive select.edgesByAngle</atom>
      <hash type="InCategory" key="toolprops:general#head">
        <atom type="Ordinal">100.70</atom>
      </hash>
      <list type="Control" val="cmd tool.attr select.edgesByAngle angle ?">
		    <atom type="ShowWhenDisabled">1</atom>
      </list>
      <list type="Control" val="cmd tool.attr select.edgesByAngle operator ?">
		    <atom type="ShowWhenDisabled">1</atom>
      </list>
      <list type="Control" val="cmd tool.attr select.edgesByAngle deselect ?">
		    <atom type="ShowWhenDisabled">1</atom>
      </list>
    </hash>
    <hash type="Sheet" key="select.edgesByAngle.item:sheet">
      <atom type="Label">Select Edges By Angle</atom>
      <atom type="Filter">select.edgesByAngle.item:filterPreset</atom>
      <atom type="FilterCommand">item.withTypeIsSelected {select.edgesByAngle.item} testSupertypes:true</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">110</atom>
      </hash>
    </hash>
  </atom>
  <atom type="CommandHelp">
    <hash type="Tool" key="select.edgesByAngle@en_US">
      <atom type="UserName">Select Edges By Angle</atom>
      <atom type="Tooltip">Select Edges By Angle</atom>
      <atom type="Desc">Select edges by angle between polygons tool.</atom>
      <hash type="Attribute" key="angle">
        <atom type="UserName">Angle</atom>
        <atom type="Desc">Angle between polygons.</atom>
      </hash>
      <hash type="Attribute" key="operator">
        <atom type="UserName">Operator</atom>
        <atom type="Desc">Comparison operator for angle.</atom>
        <atom type="ArgumentType">comparison_operators</atom>
      </hash>
      <hash type="Attribute" key="deselect">
        <atom type="UserName">Deselect</atom>
        <atom type="Desc">Deselect the edges.</atom>
      </hash>
    </hash>
    <hash type="ArgumentType" key="comparison_operators@en_US">
      <hash type="Option" key="less_than">
        <atom type="UserName">&lt;</atom>
        <atom type="Desc">Less than.</atom>
      </hash>
      <hash type="Option" key="equal">
        <atom type="UserName">=</atom>
        <atom type="Desc">Equal.</atom>
      </hash>
      <hash type="Option" key="greater_than">
        <atom type="UserName">&gt;</atom>
        <atom type="Desc">Greater than.</atom>
      </hash>
    </hash>
  </atom>
  <atom type="Messages">
    <hash type="Table" key="select.edgesByAngle.en_US">
      <hash type="T" key="NoVertex">This tool is no mesh element on active meshes.</hash>
    </hash>
  </atom>
</configuration>
