      </hash>
      <hash type="Option" key="outVector">
        <atom type="UserName">Out Vector</atom>
        <atom type="Desc">Outgoing vector.</atom>
      </hash>
    </hash>
  </atom>
  <atom type="Messages">
    <hash type="Table" key="select.edgesByNormal.en_US">
      <hash type="T" key="NoEdgeSelected">Please select the edge to serve as the reference edge.</hash>
      <hash type="T" key="NoVertex">This tool is no mesh element on active meshes.</hash>
    </hash>
  </atom>

