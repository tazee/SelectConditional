<?xml version="1.0" encoding="UTF-8"?>
<configuration kit="SelectConditional" version="1.0">
  <atom type="Extensions64">
    <list type="AutoScan">extra</list>
  </atom>
  <atom type="Attributes">
    <hash type="Sheet" key="SelectConditional_Help:sheet">
      <atom type="Label">Conditional Selection</atom>
      <atom type="Group">Conditional Selection</atom>
      <atom type="Style">inline</atom>
      <hash type="InCategory" key="ExtensionHelp:sheet#tail">
        <atom type="Ordinal">30</atom>
      </hash>
      <list type="Control" val="cmd file.open {kit_SelectConditional:README.html}">
        <atom type="Label">Conditional Selection Help</atom>
        <atom type="StartCollapsed">0</atom>
        <atom type="Hash">SelectConditional_Help:control</atom>
      </list>
    </hash>
    <hash type="Sheet" key="SelectConditionalToolbar:sheet">
      <atom type="Label">Conditional Selection</atom>
      <atom type="Style">popover</atom>
      <hash type="InCategory" key="TemplateModelToolbar:Select#tail">
        <atom type="Ordinal">49.50.65</atom>
      </hash>
      <list type="Control" val="cmd tool.set select.edgesByLength on">
        <atom type="Label">Select Edges By Length</atom>
      </list>
      <list type="Control" val="cmd tool.set select.edgesByNormal on">
        <atom type="Label">Select Edges By Normal</atom>
      </list>
      <list type="Control" val="cmd tool.set select.edgesByEdgeVector on">
        <atom type="Label">Select Edges By Edge Vector</atom>
      </list>
      <list type="Control" val="cmd tool.set select.polysByArea on">
        <atom type="Label">Select Polygons By Area</atom>
      </list>
      <list type="Control" val="cmd tool.set select.random on">
        <atom type="Label">Random Selection</atom>
      </list>
    </hash>
  </atom>

  <!-- Select Edges By Length -->
  <atom type="Attributes">
    <hash type="Sheet" key="SelectEdgesByLength:sheet">
      <atom type="Label">Select Edges By Length</atom>
      <atom type="ShowLabel">1</atom>
      <atom type="Layout">properties</atom>
      <atom type="Columns">1</atom>
      <atom type="IconMode">text</atom>
      <atom type="IconSize">small</atom>
      <atom type="FilterCommand">tool.isActive select.edgesByLength</atom>
      <hash type="InCategory" key="toolprops:general#head">
        <atom type="Ordinal">100.70</atom>
      </hash>
      <list type="Control" val="cmd tool.attr select.edgesByLength length ?">
		    <atom type="ShowWhenDisabled">0</atom>
      </list>
      <list type="Control" val="sub edgesByLength_range:sheet">
		    <atom type="ShowWhenDisabled">1</atom>
      </list>
      <list type="Control" val="cmd tool.attr select.edgesByLength operator ?">
		    <atom type="ShowWhenDisabled">1</atom>
      </list>
      <list type="Control" val="cmd tool.attr select.edgesByLength deselect ?">
		    <atom type="ShowWhenDisabled">1</atom>
      </list>
    </hash>
    <hash type="Sheet" key="edgesByLength_range:sheet">
		<atom type="Label">Edge Length Range</atom>
		<atom type="Style">inlinegang</atom>
      <list type="Control" val="cmd tool.attr select.edgesByLength range0 ?">
		<atom type="ShowWhenDisabled">0</atom>
		</list>
      <list type="Control" val="cmd tool.attr select.edgesByLength range1 ?">
		<atom type="Label">Max</atom>
		<atom type="ShowWhenDisabled">0</atom>
	  </list>
    </hash>
    <hash type="Sheet" key="select.edgesByLength.item:sheet">
      <atom type="Label">Select Edges By Length</atom>
      <atom type="Filter">select.edgesByLength.item:filterPreset</atom>
      <atom type="FilterCommand">item.withTypeIsSelected {select.edgesByLength.item} testSupertypes:true</atom>
      <hash type="InCategory" key="itemprops:general#head">
        <atom type="Ordinal">110</atom>
      </hash>
    </hash>
  </atom>
  <atom type="CommandHelp">
    <hash type="Tool" key="select.edgesByLength@en_US">
      <atom type="UserName">Select Edges By Length</atom>
      <atom type="Tooltip">Select Edges By Length</atom>
      <atom type="Desc">Select edges by length tool.</atom>
      <hash type="Attribute" key="length">
        <atom type="UserName">Length</atom>
        <atom type="Desc">Edge length.</atom>
      </hash>
      <hash type="Attribute" key="operator">
        <atom type="UserName">Operator</atom>
        <atom type="Desc">Comparison operator for angle.</atom>
        <atom type="ArgumentType">conditional_operators</atom>
      </hash>
      <hash type="Attribute" key="deselect">
        <atom type="UserName">Deselect</atom>
        <atom type="Desc">Deselect the edges.</atom>
      </hash>
      <hash type="Attribute" key="range0">
        <atom type="UserName">Length Min</atom>
        <atom type="Desc">Minimum of value.</atom>
      </hash>
      <hash type="Attribute" key="range1">
        <atom type="UserName">Length Max</atom>
        <atom type="Desc">Maximum of value.</atom>
      </hash>
    </hash>
    <hash type="ArgumentType" key="conditional_operators@en_US">
      <hash type="Option" key="less_than">
        <atom type="UserName">&lt;</atom>
        <atom type="Desc">Less than.</atom>
      </hash>
      <hash type="Option" key="range">
        <atom type="UserName">&gt;=&lt;</atom>
        <atom type="Desc">Range.</atom>
      </hash>
      <hash type="Option" key="greater_than">
        <atom type="UserName">&gt;</atom>
        <atom type="Desc">Greater than.</atom>
      </hash>
    </hash>
  </atom>
  <atom type="Messages">
    <hash type="Table" key="select.edgesByLength.en_US">
      <hash type="T" key="NoVertex">This tool is no mesh element on active meshes.</hash>
    </hash>
  </atom>

